name: Morning Devotional Notification

on:
  schedule:
    - cron: '0 4 * * *'   # 06:00 SAST = 04:00 UTC, every day
  workflow_dispatch:        # allows manual "Run workflow" button for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Send morning notification
        run: node send-morning-notification.js
        working-directory: functions
