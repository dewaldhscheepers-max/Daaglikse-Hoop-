<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daaglikse Hoop — Elke oggend 'n woord van hoop</title>
<meta name="description" content="Elke oggend 'n kort boodskap van hoop, gebed en bemoediging. Gratis. Geen registrasie.">

<!-- Open Graph (WhatsApp, Facebook, iMessage) -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://dewaldscheepers.com/go">
<meta property="og:title"       content="Daaglikse Hoop">
<meta property="og:description" content="Elke oggend 'n kort boodskap van hoop, gebed en bemoediging. Gratis. Geen registrasie.">
<meta property="og:image"       content="https://dewaldscheepers.com/notification-image.jpg">
<meta property="og:image:width"  content="800">
<meta property="og:image:height" content="400">

<!-- Twitter / X -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Daaglikse Hoop">
<meta name="twitter:description" content="Elke oggend 'n kort boodskap van hoop, gebed en bemoediging.">
<meta name="twitter:image"       content="https://dewaldscheepers.com/notification-image.jpg">

<link rel="icon" href="/icons/icon-192.png">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple:      #7C6FAF;
    --purple-dark: #5C4E8E;
    --lavender:    #C4B0E8;
    --cream:       #FAF8F5;
    --text:        #2D2040;
    --muted:       #8A7E9A;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 60px;
    text-align: center;
  }

  .card {
    background: #fff;
    border-radius: 28px;
    padding: 40px 28px 36px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(124,111,175,0.12);
  }

  .app-icon {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    margin: 0 auto 20px;
    display: block;
  }

  .tag {
    display: inline-block;
    background: #EDE8F8;
    color: var(--purple);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    border-radius: 20px;
    padding: 4px 12px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.2;
  }

  .subtitle {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .btn-primary {
    display: block;
    width: 100%;
    background: var(--purple);
    color: #fff;
    text-decoration: none;
    padding: 16px 24px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    transition: background 0.2s;
  }
  .btn-primary:active { background: var(--purple-dark); }

  .features {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }

  .feature-icon { font-size: 20px; }

  /* Samsung-only chrome prompt */
  .chrome-prompt {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: #EDE8F8;
    border-radius: 16px;
  }

  .chrome-prompt p {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .btn-chrome {
    display: block;
    background: #4285f4;
    color: #fff;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
  }
</style>

<script>
  var ua        = navigator.userAgent
  var isAndroid = /Android/i.test(ua)

  function getStartUrl() {
    if (isAndroid) return 'intent://dewaldscheepers.com/#Intent;scheme=https;package=com.android.chrome;end'
    return '/'
  }

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('start-btn')
    btn.href = getStartUrl()
  })
</script>
</head>

<body>
  <div class="card">
    <img class="app-icon" src="/icons/icon-192.png" alt="Daaglikse Hoop">

    <span class="tag">Deur Dewald Scheepers</span>

    <h1>Daaglikse Hoop</h1>

    <p class="subtitle">
      Stemnotas, gebed, e-boeke en daaglikse<br>
      bemoediging — alles op een plek.
    </p>

    <a class="btn-primary" id="start-btn" href="/">Begin luister →</a>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">🎧</span>
        <span>Stemnotas</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🙏</span>
        <span>Gebedsruimte</span>
      </div>
      <div class="feature">
        <span class="feature-icon">📖</span>
        <span>E-boeke</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🔔</span>
        <span>6:30 kennisgewings</span>
      </div>
    </div>
  </div>
</body>
</html>
