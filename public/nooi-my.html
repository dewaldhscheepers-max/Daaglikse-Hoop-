<!DOCTYPE html>
<html>
<body>
  <!-- Static form for Netlify form detection -->
  <form name="nooi-my" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="nooi-my" />
    <input type="text"   name="naam" />
    <input type="email"  name="epos" />
    <input type="tel"    name="telefoon" />
    <input type="text"   name="gemeente" />
    <input type="text"   name="datum" />
    <textarea            name="boodskap"></textarea>
    <button type="submit">Stuur</button>
  </form>
</body>
</html>
