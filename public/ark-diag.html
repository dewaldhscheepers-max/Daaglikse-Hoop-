<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ark diagnose</title>
<style>
  html, body { height: 100%; width: 100%; overflow: hidden; margin: 0; }
  body { background: #F7C948; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  /* Presies dieselfde as die spel se oorlegblad */
  .oorleg {
    position: fixed;
    inset: 0;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 260;
    background: linear-gradient(#2A2340, #100D17);
    color: #EDE8F5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .kop { padding: 40px 16px 10px; font-size: 17px; font-weight: 700; flex: 0 0 auto; }
  .mid { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px; }
  .voet {
    flex: 0 0 auto;
    background: #C0392B;
    padding: 16px;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.10); vertical-align: top; }
  td:first-child { color: #A99CC4; padding-right: 10px; white-space: nowrap; }
  td:last-child { text-align: right; font-weight: 700; font-family: monospace; }
  .goed { color: #6BE59A; }
  .sleg { color: #FF8A80; }
  .nota { font-size: 12px; color: #A99CC4; padding: 10px 0 0; line-height: 1.5; }
</style>
</head>
<body>

<div class="oorleg" id="ov">
  <div class="kop">Ark diagnose</div>
  <div class="mid">
    <table id="t"></table>
    <p class="nota">
      Die rooi balk heel onder moet sigbaar wees.<br>
      As jy geel sien, is die oorlegblad te kort.
    </p>
  </div>
  <div class="voet">ONDERSTE BALK — moet sigbaar wees</div>
</div>

<script>
function ry(naam, waarde, klas) {
  return '<tr><td>' + naam + '</td><td' + (klas ? ' class="' + klas + '"' : '') + '>' + waarde + '</td></tr>'
}

function meet() {
  const ov = document.getElementById('ov')
  const r  = ov.getBoundingClientRect()
  const vv = window.visualViewport

  const skerm = window.innerHeight
  const pas   = Math.abs(r.height - skerm) < 2

  let h = ''
  h += ry('oorlegblad hoogte', Math.round(r.height) + 'px', pas ? 'goed' : 'sleg')
  h += ry('window.innerHeight', skerm + 'px')
  h += ry('pas dit?', pas ? 'JA' : 'NEE — ' + Math.round(skerm - r.height) + 'px kort', pas ? 'goed' : 'sleg')
  h += ry('oorlegblad bo', Math.round(r.top) + 'px', Math.abs(r.top) < 2 ? 'goed' : 'sleg')
  h += ry('ouer-element', ov.parentElement.tagName)
  h += ry('doc clientHeight', document.documentElement.clientHeight + 'px')
  h += ry('body clientHeight', document.body.clientHeight + 'px')
  h += ry('outerHeight', window.outerHeight + 'px')
  h += ry('visualViewport', vv ? Math.round(vv.height) + 'px' : 'geen')
  h += ry('vV skaal', vv ? vv.scale.toFixed(2) : '—')
  h += ry('vV offsetTop', vv ? Math.round(vv.offsetTop) + 'px' : '—')
  h += ry('breedte', window.innerWidth + 'px')
  h += ry('devicePixelRatio', (window.devicePixelRatio || 1).toFixed(2))
  h += ry('skerm', screen.width + '×' + screen.height)
  h += ry('CSS.supports inset', CSS.supports('inset', '0') ? 'ja' : 'NEE', CSS.supports('inset','0') ? 'goed' : 'sleg')
  h += ry('CSS.supports dvh', CSS.supports('height', '100dvh') ? 'ja' : 'NEE', CSS.supports('height','100dvh') ? 'goed' : 'sleg')
  h += ry('roundRect', typeof CanvasRenderingContext2D !== 'undefined' &&
          typeof CanvasRenderingContext2D.prototype.roundRect === 'function' ? 'ja' : 'NEE')

  const ua = navigator.userAgent
  const chrome = (ua.match(/Chrome\/(\d+)/) || [])[1] || '?'
  const samsung = (ua.match(/SamsungBrowser\/([\d.]+)/) || [])[1]
  h += ry('Chrome', chrome)
  if (samsung) h += ry('Samsung Internet', samsung)
  h += ry('standalone', window.matchMedia('(display-mode: standalone)').matches ? 'ja (PWA)' : 'nee (blaaier)')

  document.getElementById('t').innerHTML = h
}

meet()
setTimeout(meet, 300)
setTimeout(meet, 1200)
window.addEventListener('resize', meet)
window.addEventListener('orientationchange', () => setTimeout(meet, 250))
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', meet)
  window.visualViewport.addEventListener('scroll', meet)
}
</script>

</body>
</html>
